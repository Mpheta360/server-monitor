<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <main class="dash-layout">
      <aside class="side-nav">
        <div class="brand">
          <div class="brand-mark">
            <span class="brand-rail"></span>
            <span class="brand-rail"></span>
          </div>
          <div class="brand-title">SYSMON <small>v2.4.1</small></div>
        </div>
        <nav>
          <a class="nav-item active" href="#">Overview</a>
          <a class="nav-item" href="#">Servers</a>
          <a class="nav-item" href="#">Metrics</a>
          <a class="nav-item" href="#">Alerts</a>
          <a class="nav-item" href="#">Logs</a>
        </nav>
        <section class="uptime-card">
          <div>Uptime</div>
          <strong id="uptime-pct">0%</strong>
          <small>Last 30 days</small>
        </section>
      </aside>

      <section class="dash-main">
        <header class="top-status">
          <div id="fleet-status-dot" class="status-dot"></div>
          <span id="fleet-status-text">All systems operational</span>
          <div class="header-actions">
            <button id="refresh-btn" type="button" class="btn-secondary">Refresh</button>
            <form method="post" action="/sign-out">
              <button type="submit" class="btn-secondary">Sign out</button>
            </form>
          </div>
        </header>

        <section class="kpi-grid">
          <article class="kpi-card">
            <div class="kpi-head"><span>CPU Usage</span><strong id="cpu-delta">0%</strong></div>
            <div class="kpi-value"><span id="cpu-value">0%</span></div>
            <svg id="spark-cpu" class="sparkline" viewBox="0 0 240 56" preserveAspectRatio="none"></svg>
          </article>
          <article class="kpi-card">
            <div class="kpi-head"><span>Memory</span><strong id="mem-delta">0%</strong></div>
            <div class="kpi-value"><span id="mem-value">0.0 GB</span></div>
            <svg id="spark-mem" class="sparkline" viewBox="0 0 240 56" preserveAspectRatio="none"></svg>
          </article>
          <article class="kpi-card">
            <div class="kpi-head"><span>Network I/O</span><strong id="net-delta">0%</strong></div>
            <div class="kpi-value"><span id="net-value">0 Mb/s</span></div>
            <svg id="spark-net" class="sparkline" viewBox="0 0 240 56" preserveAspectRatio="none"></svg>
          </article>
          <article class="kpi-card">
            <div class="kpi-head"><span>Avg Response</span><strong id="res-delta">0%</strong></div>
            <div class="kpi-value"><span id="res-value">0ms</span></div>
            <svg id="spark-res" class="sparkline" viewBox="0 0 240 56" preserveAspectRatio="none"></svg>
          </article>
        </section>

        <section class="board-grid">
          <article class="panel servers-panel">
            <header class="panel-head"><h2>Servers</h2></header>
            <div id="servers-list" class="server-list"></div>
          </article>
          <article class="panel activity-panel">
            <header class="panel-head"><h2>Activity</h2></header>
            <div id="activity-list" class="activity-list"></div>
          </article>
        </section>
      </section>
    </main>
    <script src="/static/dashboard.js"></script>
  </body>
</html>
